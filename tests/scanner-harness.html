<!doctype html><html><head><meta charset="utf-8"><title>FilamentTrack recognition audit</title><script src="../vendor/zxing.min.js"></script><script src="../vendor/tesseract.min.js"></script><style>body{font:16px system-ui;padding:24px}pre{white-space:pre-wrap}img{max-width:700px;max-height:400px}</style></head><body><h1>Recognition audit · local QA</h1><p>This page reads a local photo. It never updates inventory.</p><label>Label photo <input type="file" id="photo" accept="image/*"></label><p id="progress" role="status">Choose a photo.</p><img id="image" alt="Test label" hidden><pre id="result"></pre><video id="video" hidden></video><script type="module">
import {LabelScanner} from '../scanner.js';import {parseLabel} from '../core.js';
const scanner=new LabelScanner(document.getElementById('video'),result=>{document.getElementById('result').textContent=JSON.stringify({...result,image:undefined,parsed:parseLabel(result.text||'')},null,2);if(result.image){document.getElementById('image').src=result.image;document.getElementById('image').hidden=false;}document.getElementById('progress').textContent='Complete';},text=>document.getElementById('progress').textContent=text,()=>{});
document.getElementById('photo').addEventListener('change',async event=>{try{await scanner.photo(event.target.files[0]);}catch(e){document.getElementById('progress').textContent=e.message;}});
</script></body></html>
