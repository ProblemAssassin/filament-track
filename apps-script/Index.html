<!doctype html><html lang="en"><head><base target="_top"><meta charset="utf-8"><style>body{font:16px system-ui;background:#101c2c;color:#eef5f6;max-width:620px;margin:8vh auto;padding:24px;line-height:1.6}a,button{display:inline-block;background:#28d7a6;color:#052b24;border:0;border-radius:10px;padding:12px 18px;font:600 16px system-ui;text-decoration:none}small{color:#a4b6c7}#result{white-space:pre-wrap}</style></head><body>
<h1>FilamentTrack</h1><p>Your private Google Sheets connection.</p><p id="status" role="status">Checking access…</p><p><button id="open" type="button" disabled>Open connected app ↗</button></p><button id="check" type="button">Check connection</button><p id="result"></p><small>Keep this Google connection tab open in the background while scanning. Your Sheet stays private.</small>
<script>
const APP_ORIGIN = <?!= JSON.stringify(appOrigin) ?>;
const APP_URL = <?!= JSON.stringify(appUrl) ?>;
const CONNECTION_URL = <?!= JSON.stringify(connectionUrl) ?>;
let clientWindow=null,channel='',announcer=null;
function send(value){if(clientWindow&&!clientWindow.closed)clientWindow.postMessage({...value,channel},APP_ORIGIN);}
window.addEventListener('message',event=>{
  if(event.origin!==APP_ORIGIN||event.source!==clientWindow)return;
  const data=event.data;
  if(!data||data.channel!==channel)return;
  if(data.type==='tracker-hello'){send({type:'tracker-ready',connectionUrl:CONNECTION_URL});return;}
  if(data.type!=='tracker-request'||typeof data.id!=='string'||!data.request||!['list','mutate','receipt'].includes(data.request.method))return;
  clearInterval(announcer);
  google.script.run.withSuccessHandler(result=>send({type:'tracker-response',id:data.id,result})).withFailureHandler(error=>send({type:'tracker-response',id:data.id,error:error.message||'Google Sheets request failed.'})).trackerApi(data.request);
});
function check(){
  document.getElementById('status').textContent='Checking Google Sheets…';
  google.script.run.withSuccessHandler(result=>{
    document.getElementById('status').textContent='Connected to your private inventory.';
    document.getElementById('result').textContent=result.products.length+' product(s) · '+result.products.reduce((n,p)=>n+p.storage,0)+' rolls in storage';
    document.getElementById('open').disabled=false;
  }).withFailureHandler(error=>{document.getElementById('status').textContent=error.message||'Connection failed.';send({type:'tracker-error',error:error.message||'Connection failed.'});}).trackerApi({method:'list'});
}
document.getElementById('check').addEventListener('click',check);check();
document.getElementById('open').addEventListener('click',()=>{
  clearInterval(announcer);channel=crypto.randomUUID();clientWindow=window.open(APP_URL+'#bridge='+channel+'&googleOrigin='+encodeURIComponent(location.origin),'filamenttrack-'+channel);
  let attempts=0;
  announcer=setInterval(()=>{if(++attempts>90||!clientWindow||clientWindow.closed){clearInterval(announcer);return;}send({type:'tracker-ready',connectionUrl:CONNECTION_URL});},500);
  document.getElementById('status').textContent=clientWindow?'Connected app opened. Keep this Google tab open in the background.':'Your browser blocked the new tab. Allow this opening and try again.';
});
</script></body></html>
